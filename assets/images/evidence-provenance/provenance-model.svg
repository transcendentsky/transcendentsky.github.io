<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Execution Provenance Model</title>
  <desc id="desc">Execution provenance records agents, activities, entities, inputs, outputs, and environment.</desc>
  <rect width="1080" height="560" rx="28" fill="#fbfaf7"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Execution Provenance：记录“谁在什么环境下做了什么”</text>
  <text x="58" y="110" font-family="Arial, sans-serif" font-size="18" fill="#64748b">参考 PROV 思路，把执行者、活动、输入输出、环境和制品关联起来</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="210" width="180" height="90" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="190" y="246" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Agent</text>
    <text x="190" y="274" text-anchor="middle" font-size="14" fill="#64748b">用户 / 服务 / 模型</text>
    <rect x="370" y="180" width="220" height="150" rx="22" fill="#7c3aed"/>
    <text x="480" y="236" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Activity</text>
    <text x="480" y="272" text-anchor="middle" font-size="16" fill="#ede9fe">命令 / 工具调用 / 构建</text>
    <rect x="680" y="140" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="785" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Input Entity</text>
    <text x="785" y="197" text-anchor="middle" font-size="14" fill="#64748b">prompt / 文件 / 数据</text>
    <rect x="680" y="285" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="785" y="317" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Output Entity</text>
    <text x="785" y="342" text-anchor="middle" font-size="14" fill="#64748b">补丁 / 报告 / 制品</text>
    <path d="M280 255 H370" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    <path d="M590 235 C625 235 630 179 680 179" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    <path d="M590 280 C625 280 630 324 680 324" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="150" y="430" width="190" height="52" rx="26" fill="#e0f2fe"/>
    <text x="245" y="463" text-anchor="middle" font-size="15" fill="#075985">environment</text>
    <rect x="395" y="430" width="190" height="52" rx="26" fill="#dcfce7"/>
    <text x="490" y="463" text-anchor="middle" font-size="15" fill="#166534">version / digest</text>
    <rect x="640" y="430" width="190" height="52" rx="26" fill="#fef3c7"/>
    <text x="735" y="463" text-anchor="middle" font-size="15" fill="#854d0e">policy / approval</text>
  </g>
</svg>
