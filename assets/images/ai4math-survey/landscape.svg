<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">AI for Mathematical Reasoning landscape</title>
  <desc id="desc">A four-axis landscape for AI mathematical reasoning: informal reasoning, formal theorem proving, mathematical discovery, and reasoning-time techniques.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1120" height="620" rx="28" fill="url(#bg)"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">AI for Mathematical Reasoning：四条技术主线</text>
  <text x="58" y="110" font-family="Arial, sans-serif" font-size="18" fill="#64748b">从语言与图形题，到形式化证明、数学发现，再到训练与推理时验证</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="450" y="220" width="220" height="146" rx="22" fill="#172554"/>
    <text x="560" y="274" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">AI4Math</text>
    <text x="560" y="308" text-anchor="middle" font-size="16" fill="#dbeafe">生成、推理、验证、发现</text>
    <text x="560" y="338" text-anchor="middle" font-size="14" fill="#bfdbfe">Reasoning as a workflow</text>
    <rect x="80" y="178" width="260" height="132" rx="18" fill="#ffffff"/>
    <text x="210" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">非形式化推理</text>
    <text x="210" y="256" text-anchor="middle" font-size="15" fill="#64748b">MWP / 竞赛题 / 几何图形</text>
    <text x="210" y="283" text-anchor="middle" font-size="15" fill="#64748b">文本、公式、图像联合理解</text>
    <rect x="780" y="178" width="260" height="132" rx="18" fill="#ffffff"/>
    <text x="910" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">形式化证明</text>
    <text x="910" y="256" text-anchor="middle" font-size="15" fill="#64748b">Lean / Isabelle / proof search</text>
    <text x="910" y="283" text-anchor="middle" font-size="15" fill="#64748b">autoformalization + kernel check</text>
    <rect x="80" y="392" width="260" height="132" rx="18" fill="#ffffff"/>
    <text x="210" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">数学发现</text>
    <text x="210" y="470" text-anchor="middle" font-size="15" fill="#64748b">构造、反例、边界改进</text>
    <text x="210" y="497" text-anchor="middle" font-size="15" fill="#64748b">从解题走向提出可验候选</text>
    <rect x="780" y="392" width="260" height="132" rx="18" fill="#ffffff"/>
    <text x="910" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">推理与训练技术</text>
    <text x="910" y="470" text-anchor="middle" font-size="15" fill="#64748b">CoT / tool use / PRM / RLVR</text>
    <text x="910" y="497" text-anchor="middle" font-size="15" fill="#64748b">用验证器约束搜索空间</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M340 244 C382 244 400 270 450 286"/>
    <path d="M670 286 C720 270 738 244 780 244"/>
    <path d="M340 458 C382 458 405 368 450 340"/>
    <path d="M670 340 C715 368 738 458 780 458"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="174" y="46" width="170" height="34" rx="17" fill="#dcfce7"/>
    <text x="259" y="68" text-anchor="middle" font-size="14" fill="#166534">Language Models</text>
    <rect x="770" y="46" width="190" height="34" rx="17" fill="#fef3c7"/>
    <text x="865" y="68" text-anchor="middle" font-size="14" fill="#92400e">Neuro-symbolic Systems</text>
    <rect x="437" y="548" width="246" height="34" rx="17" fill="#e0f2fe"/>
    <text x="560" y="570" text-anchor="middle" font-size="14" fill="#075985">Verified Discovery Workflows</text>
  </g>
</svg>
