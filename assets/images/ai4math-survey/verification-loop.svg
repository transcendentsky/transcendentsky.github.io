<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Generate verify repair loop</title>
  <desc id="desc">A workflow showing informal problem understanding, candidate generation, formal or symbolic verification, error feedback, repair, and final verified result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1120" height="560" rx="28" fill="url(#bg)"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">现代 AI 数学推理的关键：生成-验证-修复闭环</text>
  <text x="58" y="110" font-family="Arial, sans-serif" font-size="18" fill="#64748b">模型负责提出候选，验证器负责给出硬反馈，系统负责持续修复和搜索</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="64" y="220" width="178" height="104" rx="18" fill="#ffffff"/>
    <text x="153" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">理解问题</text>
    <text x="153" y="289" text-anchor="middle" font-size="14" fill="#64748b">文本、图形、符号</text>
    <rect x="300" y="220" width="178" height="104" rx="18" fill="#ffffff"/>
    <text x="389" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">生成候选</text>
    <text x="389" y="289" text-anchor="middle" font-size="14" fill="#64748b">CoT / tactic / 程序</text>
    <rect x="536" y="200" width="196" height="144" rx="22" fill="#134e4a"/>
    <text x="634" y="252" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">验证器</text>
    <text x="634" y="284" text-anchor="middle" font-size="15" fill="#ccfbf1">Lean kernel / CAS / tests</text>
    <text x="634" y="312" text-anchor="middle" font-size="15" fill="#ccfbf1">答案检查 / reward</text>
    <rect x="792" y="220" width="178" height="104" rx="18" fill="#ffffff"/>
    <text x="881" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">修复搜索</text>
    <text x="881" y="289" text-anchor="middle" font-size="14" fill="#64748b">错误定位、重采样</text>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M242 272 H300"/>
    <path d="M478 272 H536"/>
    <path d="M732 272 H792"/>
    <path d="M881 324 C870 418 365 418 389 325"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="430" y="420" width="270" height="52" rx="26" fill="#dcfce7"/>
    <text x="565" y="453" text-anchor="middle" font-size="16" fill="#166534">Verified Result / Proof / Discovery Candidate</text>
    <path d="M634 344 V420" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="92" y="484" font-size="15" fill="#64748b">核心观点：数学推理系统的竞争力，不只来自“会想”，也来自“能被检查”。</text>
  </g>
</svg>
