<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">DeepEvidence architecture</title>
  <desc id="desc">DeepEvidence orchestrates breadth-first and depth-first research agents over biomedical knowledge graphs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef7f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="560" rx="28" fill="url(#bg)"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">DeepEvidence：面向生物医学知识图谱的 Deep Research Agent</text>
  <text x="58" y="110" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Orchestrator 协调 BFRS / DFRS，在异构知识图谱和文献中构建 evidence graph</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="215" width="170" height="92" rx="16" fill="#ffffff"/>
    <text x="155" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Research Query</text>
    <text x="155" y="280" text-anchor="middle" font-size="14" fill="#64748b">疾病 / 药物 / 试验问题</text>
    <rect x="300" y="185" width="190" height="152" rx="22" fill="#155e75"/>
    <text x="395" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Orchestrator</text>
    <text x="395" y="276" text-anchor="middle" font-size="16" fill="#d9f8fb">规划、分配、汇总</text>
    <rect x="555" y="160" width="170" height="92" rx="16" fill="#ffffff"/>
    <text x="640" y="197" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">BFRS</text>
    <text x="640" y="225" text-anchor="middle" font-size="14" fill="#64748b">广度搜索候选实体</text>
    <rect x="555" y="295" width="170" height="92" rx="16" fill="#ffffff"/>
    <text x="640" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">DFRS</text>
    <text x="640" y="360" text-anchor="middle" font-size="14" fill="#64748b">多跳证据推理</text>
    <rect x="795" y="185" width="210" height="152" rx="22" fill="#ffffff"/>
    <text x="900" y="232" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Evidence Graph</text>
    <text x="900" y="264" text-anchor="middle" font-size="15" fill="#64748b">实体、关系、证据、引用</text>
    <text x="900" y="292" text-anchor="middle" font-size="15" fill="#64748b">可追踪、可验证、可复核</text>
  </g>
  <path d="M240 261 H300" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M490 245 C525 245 525 206 555 206" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M490 278 C525 278 525 341 555 341" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M725 206 C760 206 760 245 795 245" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M725 341 C760 341 760 278 795 278" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <rect x="164" y="430" width="190" height="52" rx="26" fill="#e0f2fe"/>
    <text x="259" y="463" text-anchor="middle" font-size="15" fill="#075985">PubMed / Trials</text>
    <rect x="445" y="430" width="190" height="52" rx="26" fill="#dcfce7"/>
    <text x="540" y="463" text-anchor="middle" font-size="15" fill="#166534">KEGG / GO / OpenTargets</text>
    <rect x="726" y="430" width="190" height="52" rx="26" fill="#fef3c7"/>
    <text x="821" y="463" text-anchor="middle" font-size="15" fill="#854d0e">BioThings / ChEMBL / FDA</text>
  </g>
</svg>
