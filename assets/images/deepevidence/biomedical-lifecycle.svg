<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Biomedical discovery lifecycle tasks</title>
  <desc id="desc">DeepEvidence is evaluated across drug discovery, preclinical experimentation, clinical trial development, and evidence-based medicine.</desc>
  <rect width="1080" height="560" rx="28" fill="#f8fafc"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">DeepEvidence 覆盖生物医学发现的关键阶段</text>
  <text x="58" y="110" font-family="Arial, sans-serif" font-size="18" fill="#64748b">论文评测覆盖药物发现、临床前机制、临床试验设计和循证医学证据更新</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="215" width="200" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="180" y="256" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Drug Discovery</text>
    <text x="180" y="287" text-anchor="middle" font-size="15" fill="#64748b">靶点识别</text>
    <rect x="320" y="215" width="200" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="420" y="256" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Preclinical</text>
    <text x="420" y="287" text-anchor="middle" font-size="15" fill="#64748b">机制推理 / 代谢响应</text>
    <rect x="560" y="215" width="200" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="660" y="256" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Clinical Trial</text>
    <text x="660" y="287" text-anchor="middle" font-size="15" fill="#64748b">样本量 / 给药方案 / 终点</text>
    <rect x="800" y="215" width="200" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="900" y="256" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">EBM</text>
    <text x="900" y="287" text-anchor="middle" font-size="15" fill="#64748b">循证医学证据缺口</text>
    <path d="M280 270 H320 M520 270 H560 M760 270 H800" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="190" y="420" width="200" height="52" rx="26" fill="#e0f2fe"/>
    <text x="290" y="453" text-anchor="middle" font-size="15" fill="#075985">KG-grounded Search</text>
    <rect x="440" y="420" width="200" height="52" rx="26" fill="#dcfce7"/>
    <text x="540" y="453" text-anchor="middle" font-size="15" fill="#166534">Evidence Synthesis</text>
    <rect x="690" y="420" width="200" height="52" rx="26" fill="#fef3c7"/>
    <text x="790" y="453" text-anchor="middle" font-size="15" fill="#854d0e">Traceable Reasoning</text>
  </g>
