<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">RRSI 如何让 Agent 的修改进入下一轮</title>
  <desc id="desc">当前框架在演化集运行，分析反馈后提出受预算约束的候选。候选先经过泄漏审查，再测量质量与成本，通过性能底线及成本规则后才能进入下一轮。结果记录到历史中；留出集不参与候选选择。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="720" rx="24" fill="#f5f7fb"/>
  <g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
    <text x="48" y="57" font-size="30" font-weight="700" fill="#15243b">RRSI：把自我改进变成可审查的实验</text>
    <text x="48" y="91" font-size="17" fill="#52627a">模型权重固定 · 修改 harness · 约束搜索与选择</text>
    <rect x="40" y="123" width="1040" height="250" rx="18" fill="#e9efff"/>
    <text x="62" y="158" font-size="18" font-weight="700" fill="#334b96">提案端：控制怎么改</text>
    <g fill="white" stroke="#c5d1ee" stroke-width="1.5">
      <rect x="62" y="185" width="270" height="138" rx="12"/>
      <rect x="425" y="185" width="270" height="138" rx="12"/>
      <rect x="788" y="185" width="270" height="138" rx="12"/>
    </g>
    <g fill="#182d50" font-size="21" font-weight="700" text-anchor="middle">
      <text x="197" y="224">当前 harness</text>
      <text x="560" y="224">运行与分析</text>
      <text x="923" y="224">候选修改</text>
    </g>
    <g fill="#536681" font-size="17" text-anchor="middle">
      <text x="197" y="259">提示词 / 工具 / 执行流程</text><text x="197" y="288">一个可追溯的代码版本</text>
      <text x="560" y="259">演化集上的结果与轨迹</text><text x="560" y="288">明确失败发生在哪里</text>
      <text x="923" y="259">限制独立修改数量</text><text x="923" y="288">参考历史，探索未试组件</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M332 254H414"/><path d="M695 254H777"/>
    </g>
    <rect x="40" y="392" width="1040" height="190" rx="18" fill="#e7f5f1"/>
    <text x="62" y="424" font-size="18" font-weight="700" fill="#186952">选择端：控制什么能留下</text>
    <g fill="white" stroke="#bbded2" stroke-width="1.5">
      <rect x="62" y="448" width="270" height="100" rx="12"/>
      <rect x="425" y="448" width="270" height="100" rx="12"/>
      <rect x="788" y="448" width="270" height="100" rx="12"/>
    </g>
    <g fill="#174d41" font-size="21" font-weight="700" text-anchor="middle">
      <text x="197" y="484">性能与成本筛选</text><text x="560" y="484">完整评测</text><text x="923" y="484">差异审查</text>
    </g>
    <g fill="#536681" font-size="17" text-anchor="middle">
      <text x="197" y="521">历史最佳底线 + 分支规则</text><text x="560" y="521">记录分数与 policy tokens</text><text x="923" y="521">泄漏 / 无效机制 / 无界工作</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M923 323V438"/>
      <path d="M788 499H706"/><path d="M425 499H343"/>
      <path d="M62 499H21V254H51"/>
    </g>
    <text x="42" y="358" fill="#334b96" font-size="14">合格者进入下一轮；无合格者则保留当前版本</text>
    <rect x="40" y="606" width="1040" height="76" rx="12" fill="#fff" stroke="#d4dce8"/>
    <text x="62" y="637" fill="#243d60" font-size="18" font-weight="700">历史账本：假设、差异、分数、成本、结论 → 后续提案与剪枝</text>
    <text x="62" y="664" fill="#52627a" font-size="16">独立验证：留出集与 OOD 评测不参与候选选择。示意依据 RRSI 公开实现整理。</text>
  </g>
</svg>
